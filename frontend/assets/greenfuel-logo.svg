<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="title desc">
  <title id="title">GreenFuel Fuel Safe Logo</title>
  <desc id="desc">GreenFuel fuel safe mark with leaf flame and wordmark.</desc>
  <defs>
    <linearGradient id="drop" x1="183" y1="22" x2="348" y2="266" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#98d817"/>
      <stop offset=".5" stop-color="#42b83a"/>
      <stop offset="1" stop-color="#0b8f3f"/>
    </linearGradient>
    <linearGradient id="dropAccent" x1="280" y1="92" x2="334" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9e735"/>
      <stop offset="1" stop-color="#6fcb21"/>
    </linearGradient>
    <linearGradient id="word" x1="88" y1="288" x2="432" y2="288" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8bcc18"/>
      <stop offset=".45" stop-color="#28a940"/>
      <stop offset="1" stop-color="#087d34"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#175b2b" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="520" height="420" rx="28" fill="#ffffff"/>

  <g filter="url(#softShadow)">
    <path fill="url(#drop)" d="M260 17c41 69 96 128 104 191 7 56-34 98-96 98-68 0-111-43-103-99C173 145 226 83 260 17z"/>
    <path fill="url(#dropAccent)" d="M295 103c38 54 47 92 27 122-18 27-58 36-92 20 40-3 66-25 70-57 2-24-9-53-5-85z"/>
    <path fill="#ffffff" d="M238 248c-31-15-50-38-53-72-5 41 9 72 38 94 24 18 54 25 87 20-27-6-50-19-72-42z"/>
    <path fill="#ffffff" opacity=".9" d="M219 267c36-17 64-47 94-94-18 50-46 88-94 94z"/>
    <path fill="#58bd24" d="M232 285c8-30 35-62 76-89-25 32-40 58-44 83 22-10 39-28 47-53 1 39-33 72-79 59z"/>
  </g>

  <text x="260" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="url(#word)" letter-spacing="-1">GreenFuel</text>
  <text x="260" y="388" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="64" font-weight="900" fill="#20c768" stroke="#ffd629" stroke-width="5" paint-order="stroke fill" letter-spacing="1">FUEL SAFE</text>
</svg>
